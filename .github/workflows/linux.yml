name: Linux source build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build, X11, Qt runtime and virtual-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libx11-dev xvfb xauth \
            libgl1 libegl1 libopengl0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-image0 libxcb-render-util0 fonts-liberation desktop-file-utils hicolor-icon-theme
          sudo apt-get install -y libx11-xcb1 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 \
            libfontconfig1 libglib2.0-bin libzstd1 libwayland-client0 libwayland-cursor0 libwayland-egl1 libdrm2
      - name: Install Python packages locally
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[gui]'
      - name: Configure and build the Linux X11 host
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DANALYZER_LINUX_EDITOR=ON
          cmake --build build --parallel 2
      - name: Verify the Linux host also builds without an editor backend
        run: |
          cmake -S . -B build-headless -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DANALYZER_LINUX_EDITOR=OFF
          cmake --build build-headless --target vst3-host-service --parallel 2
      - name: Check native host IPC
        run: |
          .venv/bin/python - <<'PY'
          from vst3_analyzer.ipc.client import HostClient
          with HostClient("build/bin/Release/vst3-host-service", initialization_timeout=30) as client:
              print(client.capabilities)
          PY
      - name: Prepare and stage a standalone source installation
        run: |
          ./scripts/prepare-linux-install.sh
          ./scripts/install-linux-source.sh --destdir "$RUNNER_TEMP/analyzer-stage"
          "$RUNNER_TEMP/analyzer-stage/usr/bin/vst3-plugin-analyzer" --help
          desktop-file-validate "$RUNNER_TEMP/analyzer-stage/usr/share/applications/vst3-plugin-analyzer.desktop"
          python scripts/linux_source_install.py uninstall --destdir "$RUNNER_TEMP/analyzer-stage"
      - name: Retain build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: build/CMakeFiles/CMakeConfigureLog.yaml
