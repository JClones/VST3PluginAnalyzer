name: macOS source build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch pinned VST3 SDK
        run: ./scripts/fetch-vst3-sdk.sh
      - name: Prepare source installation
        run: ./scripts/setup-macos-source.sh python3
      - name: Check native host IPC
        run: |
          .venv-macos-source/bin/python - <<'PY'
          from vst3_analyzer.ipc.client import HostClient
          with HostClient("build-macos-source/bin/Release/vst3-host-service", initialization_timeout=30) as client:
              print(client.capabilities)
          PY
      - name: Retain diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: build-macos-source/CMakeFiles/CMakeConfigureLog.yaml
